name: Publish to NPM
on:
  push:
    branches:
      - ylm-experiment-2
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
      - uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.MODEL_SMAL_WEBISTE_TOKEN }}
          access: 'public'